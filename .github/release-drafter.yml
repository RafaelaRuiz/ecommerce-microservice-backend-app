name-template: 'v$NEXT_MINOR_VERSION'
tag-template: 'v$NEXT_MINOR_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug']
  - title: '🧪 Tests'
    labels: ['test']
  - title: '📚 Docs'
    labels: ['docs']
  - title: '🧹 Chore'
    labels: ['chore', 'refactor']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Changes
  $CHANGES
