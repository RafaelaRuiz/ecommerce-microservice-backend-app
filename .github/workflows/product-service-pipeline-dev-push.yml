name: Dev - CI/CD product-service

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (product-service only)
        run: ./mvnw -B -DskipTests package -pl product-service -am

      - name: Run tests
        run: ./mvnw test -pl product-service

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd product-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service-ecommerce-boot:dev .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service-ecommerce-boot:dev
