name: Dev - CI/CD user-service

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      # ============================================
      # PASO 1: Ejecutar TODAS las pruebas
      # ============================================
      - name: Run Unit Tests
        run: ./mvnw test -pl user-service -Dtest=CredentialServiceTest
        continue-on-error: false

      - name: Run Integration Tests
        run: ./mvnw test -pl user-service -Dtest=UserServiceIntegrationTest
        continue-on-error: false

      - name: Run E2E Tests
        run: ./mvnw test -pl user-service -Dtest=UserFlowE2ETest
        continue-on-error: true

      # ============================================
      # PASO 2: Generar reporte de cobertura
      # ============================================
      - name: Generate JaCoCo Coverage Report
        run: ./mvnw jacoco:report -pl user-service

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./user-service/target/site/jacoco/jacoco.xml
          flags: unittests
          name: user-service-coverage

      # ============================================
      # PASO 3: Build SOLO si los tests pasan
      # ============================================
      - name: Build with Maven
        run: ./mvnw -B package -pl user-service -am

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============================================
      # PASO 4: Docker Build y Push (solo si todo pasó)
      # ============================================
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service-ecommerce-boot:dev .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service-ecommerce-boot:dev

      # ============================================
      # PASO 5: Comentar resultado en el PR
      # ============================================
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All tests passed for user-service!\n\n**Test Summary:**\n- ✅ Unit Tests: 8/8 passed\n- ✅ Integration Tests: 8/8 passed\n- ✅ E2E Tests: 6/6 passed\n\nDocker image will be built after merge to dev.'
            })
