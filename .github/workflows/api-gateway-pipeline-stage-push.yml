name: Stage - CI/CD api-gateway

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (api-gateway only)
        run: ./mvnw -B -DskipTests package -pl api-gateway -am

      - name: Run tests
        run: ./mvnw test -pl api-gateway

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd api-gateway
          docker build -t rafaelaruiz/api-gateway-ecommerce-boot:stage .
          docker push rafaelaruiz/api-gateway-ecommerce-boot:stage
