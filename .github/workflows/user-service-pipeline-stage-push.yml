name: Stage - CI/CD user-service

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (user-service only)
        run: ./mvnw -B -DskipTests package -pl user-service -am

      - name: Run tests
        run: ./mvnw test -pl user-service

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service-ecommerce-boot:stage .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service-ecommerce-boot:stage
