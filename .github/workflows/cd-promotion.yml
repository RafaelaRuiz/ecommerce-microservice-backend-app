name: CD Promoción (dev → stage → prod)

on:
  push:
    branches: [ develop, stage ]
  release:
    types: [ published ]

env:
  REGISTRY: docker.io

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        include:
          - service: api-gateway
            image: api-gateway-ecommerce-boot
          - service: cloud-config
            image: cloud-config-ecommerce-boot
          - service: service-discovery
            image: service-discovery-ecommerce-boot
          - service: proxy-client
            image: proxy-client-ecommerce-boot
          - service: user-service
            image: user-service-ecommerce-boot
          - service: product-service
            image: product-service-ecommerce-boot
          - service: favourite-service
            image: favourite-service-ecommerce-boot
          - service: order-service
            image: order-service-ecommerce-boot
          - service: shipping-service
            image: shipping-service-ecommerce-boot
          - service: payment-service
            image: payment-service-ecommerce-boot
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build all modules (jar)
        run: mvn -B -ntp -DskipTests package --file pom.xml

      - name: Docker login (Docker Hub)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Build image
        env:
          PROJECT_VERSION: ${{ secrets.PROJECT_VERSION }}
        run: |
          TAG=${PROJECT_VERSION:-0.1.0}dev
          docker build -f ${{ matrix.service }}/Dockerfile \
            --build-arg PROJECT_VERSION=${PROJECT_VERSION:-0.1.0} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:$TAG .

      - name: Trivy gate (HIGH,CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.54.1 \
            image ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ secrets.PROJECT_VERSION || '0.1.0' }}dev \
            --severity HIGH,CRITICAL --no-progress --exit-code 1

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ secrets.PROJECT_VERSION }}dev

      - name: Notificar fallo a Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Falló despliegue DEV en ${{ matrix.service }}"

  deploy-stage:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    environment: stage
    needs: []
    strategy:
      matrix:
        include:
          - service: api-gateway
            image: api-gateway-ecommerce-boot
          - service: cloud-config
            image: cloud-config-ecommerce-boot
          - service: service-discovery
            image: service-discovery-ecommerce-boot
          - service: proxy-client
            image: proxy-client-ecommerce-boot
          - service: user-service
            image: user-service-ecommerce-boot
          - service: product-service
            image: product-service-ecommerce-boot
          - service: favourite-service
            image: favourite-service-ecommerce-boot
          - service: order-service
            image: order-service-ecommerce-boot
          - service: shipping-service
            image: shipping-service-ecommerce-boot
          - service: payment-service
            image: payment-service-ecommerce-boot
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build all modules (jar)
        run: mvn -B -ntp -DskipTests package --file pom.xml
      - name: Docker login (Docker Hub)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - name: Build image
        env:
          PROJECT_VERSION: ${{ secrets.PROJECT_VERSION }}
        run: |
          TAG=${PROJECT_VERSION:-0.1.0}stage
          docker build -f ${{ matrix.service }}/Dockerfile \
            --build-arg PROJECT_VERSION=${PROJECT_VERSION:-0.1.0} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:$TAG .
      - name: Trivy gate (HIGH,CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.54.1 \
            image ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ secrets.PROJECT_VERSION || '0.1.0' }}stage \
            --severity HIGH,CRITICAL --no-progress --exit-code 1
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ secrets.PROJECT_VERSION }}stage
      - name: Notificar fallo a Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Falló despliegue STAGE en ${{ matrix.service }}"

  deploy-prod:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      matrix:
        include:
          - service: api-gateway
            image: api-gateway-ecommerce-boot
          - service: cloud-config
            image: cloud-config-ecommerce-boot
          - service: service-discovery
            image: service-discovery-ecommerce-boot
          - service: proxy-client
            image: proxy-client-ecommerce-boot
          - service: user-service
            image: user-service-ecommerce-boot
          - service: product-service
            image: product-service-ecommerce-boot
          - service: favourite-service
            image: favourite-service-ecommerce-boot
          - service: order-service
            image: order-service-ecommerce-boot
          - service: shipping-service
            image: shipping-service-ecommerce-boot
          - service: payment-service
            image: payment-service-ecommerce-boot
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build all modules (jar)
        run: mvn -B -ntp -DskipTests package --file pom.xml
      - name: Docker login (Docker Hub)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - name: Build image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build -f ${{ matrix.service }}/Dockerfile \
            --build-arg PROJECT_VERSION=${RELEASE_TAG#v} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${RELEASE_TAG#v} .
      - name: Trivy gate (HIGH,CRITICAL)
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.54.1 \
            image ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${RELEASE_TAG#v} \
            --severity HIGH,CRITICAL --no-progress --exit-code 1
      - name: Push image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${RELEASE_TAG#v}
      - name: Notificar fallo a Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Falló despliegue PROD en ${{ matrix.service }} (tag ${{ github.event.release.tag_name }})"
