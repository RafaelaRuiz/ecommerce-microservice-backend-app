name: Prod - CI/CD order-service

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (order-service only)
        run: ./mvnw -B -DskipTests package -pl order-service -am

      - name: Run tests
        run: ./mvnw test -pl order-service

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd order-service
          docker build -t rafaelaruiz/order-service-ecommerce-boot:latest .
          docker push rafaelaruiz/order-service-ecommerce-boot:latest
