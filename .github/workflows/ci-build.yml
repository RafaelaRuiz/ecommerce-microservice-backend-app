name: CI Build - Microservices

on:
  push:
    branches: [dev, stage, master]
  pull_request:
    branches: [dev, stage, master]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  JAVA_VERSION: "11"
  IMAGE_TAG_BRANCH: ${{ github.ref_name }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      cloud-config: ${{ steps.changes.outputs.cloud-config }}
      service-discovery: ${{ steps.changes.outputs.service-discovery }}
      user-service: ${{ steps.changes.outputs.user-service }}
      product-service: ${{ steps.changes.outputs.product-service }}
      order-service: ${{ steps.changes.outputs.order-service }}
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - 'pom.xml'
            cloud-config:
              - 'cloud-config/**'
              - 'pom.xml'
            service-discovery:
              - 'service-discovery/**'
              - 'pom.xml'
            user-service:
              - 'user-service/**'
              - 'pom.xml'
            product-service:
              - 'product-service/**'
              - 'pom.xml'
            order-service:
              - 'order-service/**'
              - 'pom.xml'

      - name: Set environment based on branch
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  build-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl api-gateway -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/api-gateway-ecommerce-boot"
          docker build -f api-gateway/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  build-cloud-config:
    needs: detect-changes
    if: needs.detect-changes.outputs.cloud-config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl cloud-config -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cloud-config-ecommerce-boot"
          docker build -f cloud-config/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  build-service-discovery:
    needs: detect-changes
    if: needs.detect-changes.outputs.service-discovery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl service-discovery -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/service-discovery-ecommerce-boot"
          docker build -f service-discovery/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  build-user-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl user-service -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/user-service-ecommerce-boot"
          docker build -f user-service/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  build-product-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.product-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl product-service -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/product-service-ecommerce-boot"
          docker build -f product-service/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  build-order-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests -pl order-service -am
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          BRANCH=${{ github.ref_name }}
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/order-service-ecommerce-boot"
          docker build -f order-service/Dockerfile -t ${IMAGE}:${BRANCH} .
          docker push ${IMAGE}:${BRANCH}

  trigger-deployment:
    needs:
      - detect-changes
      - build-api-gateway
      - build-cloud-config
      - build-service-discovery
      - build-user-service
      - build-product-service
      - build-order-service

    if: |
      always() && 
      github.event_name == 'push' &&
      (needs.build-api-gateway.result == 'success' || needs.build-api-gateway.result == 'skipped') &&
      (needs.build-cloud-config.result == 'success' || needs.build-cloud-config.result == 'skipped') &&
      (needs.build-service-discovery.result == 'success' || needs.build-service-discovery.result == 'skipped') &&
      (needs.build-user-service.result == 'success' || needs.build-user-service.result == 'skipped') &&
      (needs.build-product-service.result == 'success' || needs.build-product-service.result == 'skipped') &&
      (needs.build-order-service.result == 'success' || needs.build-order-service.result == 'skipped') &&

    runs-on: ubuntu-latest
    steps:
      - name: Check if any service was built
        id: check-builds
        run: |
          BUILT="false"
          [[ "${{ needs.detect-changes.outputs.api-gateway }}" == "true" ]] && BUILT="true"
          [[ "${{ needs.detect-changes.outputs.cloud-config }}" == "true" ]] && BUILT="true"
          [[ "${{ needs.detect-changes.outputs.service-discovery }}" == "true" ]] && BUILT="true"
          [[ "${{ needs.detect-changes.outputs.user-service }}" == "true" ]] && BUILT="true"
          [[ "${{ needs.detect-changes.outputs.product-service }}" == "true" ]] && BUILT="true"
          [[ "${{ needs.detect-changes.outputs.order-service }}" == "true" ]] && BUILT="true"
          echo "any_built=${BUILT}" >> $GITHUB_OUTPUT

      - name: Trigger deployment workflow (infra repo)
        if: steps.check-builds.outputs.any_built == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: ${{ secrets.INFRA_REPO }}
          event-type: deploy-to-aks
          client-payload: |
            {
              "environment": "${{ needs.detect-changes.outputs.environment }}",
              "sha": "${{ github.sha }}",
              "changed_services": {
                "api-gateway": "${{ needs.detect-changes.outputs.api-gateway }}",
                "cloud-config": "${{ needs.detect-changes.outputs.cloud-config }}",
                "service-discovery": "${{ needs.detect-changes.outputs.service-discovery }}",
                "user-service": "${{ needs.detect-changes.outputs.user-service }}",
                "product-service": "${{ needs.detect-changes.outputs.product-service }}",
                "order-service": "${{ needs.detect-changes.outputs.order-service }}"
              }
            }

      - name: Summary
        run: |
          echo "## CI Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| api-gateway | ${{ needs.detect-changes.outputs.api-gateway }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cloud-config | ${{ needs.detect-changes.outputs.cloud-config }} |" >> $GITHUB_STEP_SUMMARY
          echo "| service-discovery | ${{ needs.detect-changes.outputs.service-discovery }} |" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | ${{ needs.detect-changes.outputs.user-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| product-service | ${{ needs.detect-changes.outputs.product-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| order-service | ${{ needs.detect-changes.outputs.order-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.detect-changes.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
