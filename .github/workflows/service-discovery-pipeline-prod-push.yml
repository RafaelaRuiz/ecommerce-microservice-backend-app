name: Prod - CI/CD service-discovery

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven (service-discovery only)
        run: ./mvnw -B -DskipTests package -pl service-discovery -am

      - name: Run tests
        run: ./mvnw test -pl service-discovery

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          cd service-discovery
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/service-discovery-ecommerce-boot:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/service-discovery-ecommerce-boot:latest
