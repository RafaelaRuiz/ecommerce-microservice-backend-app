name: Infrastructure - Deploy to Azure AKS

on:
  push:
    branches: [infra]
    paths:
      - "infra/**"
  workflow_dispatch: # Permite ejecución manual

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./infra/terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./infra/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/terraform
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: infra/terraform/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment:
      name: staging # Requiere aprobación manual
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: infra/terraform/

      - name: Terraform Init
        working-directory: ./infra/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ecommerce-microservices-rg \
            --name ecommerce-aks-cluster \
            --overwrite-existing

      - name: Verify Kubernetes Connection
        run: kubectl get nodes

  deploy-to-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ecommerce-microservices-rg \
            --name ecommerce-aks-cluster \
            --overwrite-existing

      - name: Deploy Infrastructure Services (Zipkin, Eureka, Config)
        run: |
          kubectl apply -f infra/k8s/zipkin/
          kubectl apply -f infra/k8s/service-discovery/
          kubectl apply -f infra/k8s/cloud-config/

      - name: Wait for Infrastructure Services
        run: |
          kubectl wait --for=condition=ready pod -l app=zipkin --timeout=120s
          kubectl wait --for=condition=ready pod -l app=service-discovery --timeout=120s
          kubectl wait --for=condition=ready pod -l app=cloud-config --timeout=120s

      - name: Deploy Business Services
        run: |
          kubectl apply -f infra/k8s/api-gateway/
          kubectl apply -f infra/k8s/user-service/
          kubectl apply -f infra/k8s/order-service/
          kubectl apply -f infra/k8s/product-service/

      - name: Wait for Business Services
        run: |
          kubectl wait --for=condition=ready pod -l app=api-gateway --timeout=180s
          kubectl wait --for=condition=ready pod -l app=user-service --timeout=180s
          kubectl wait --for=condition=ready pod -l app=order-service --timeout=180s
          kubectl wait --for=condition=ready pod -l app=product-service --timeout=180s

      - name: Get Service Endpoints
        run: |
          echo "=== All Services ==="
          kubectl get services
          echo ""
          echo "=== All Pods ==="
          kubectl get pods
          echo ""
          echo "=== API Gateway External IP ==="
          kubectl get service api-gateway

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "🔗 Access your services:"
          echo "- API Gateway: http://$(kubectl get service api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          echo "- Eureka Dashboard: Use port-forward (kubectl port-forward service/service-discovery 8761:8761)"
          echo "- Zipkin: Use port-forward (kubectl port-forward service/zipkin 9411:9411)"
