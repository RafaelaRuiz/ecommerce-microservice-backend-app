name: CI

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL para pruebas E2E/Performance/Security'
        required: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Run unit & IT tests
        run: ./mvnw -B -DskipTests=false clean verify
      - name: Upload surefire/failsafe reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
      - name: Jacoco aggregate report
        run: ./mvnw -q jacoco:report-aggregate
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco-aggregate

  performance:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Locust
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install locust
      - name: Run Locust headless
        env:
          TARGET_HOST: ${{ github.event.inputs.target_url || 'http://localhost:8080' }}
        run: |
          locust -f tests/performance/locustfile.py --headless -u 50 -r 5 -t 2m

  security:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: ${{ github.event.inputs.target_url || 'http://localhost:8080' }}
          fail_action: false
          generate_report: true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html