name: Release Please (SemVer automático)

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: maven
          package-name: ecommerce-microservice-backend
          bump-minor-pre-major: true
          changelog-types: |
            feat: Features
            fix: Bug Fixes
            perf: Performance Improvements
            refactor: Refactors
            docs: Documentation
            chore: Chores
