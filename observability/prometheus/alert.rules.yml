groups:
  - name: default
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          description: 'Target {{ $labels.instance }} is down'
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{outcome="ERROR"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          description: 'High error rate on {{ $labels.service }}'