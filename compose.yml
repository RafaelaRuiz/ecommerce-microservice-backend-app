services:
  zipkin-container:
    image: openzipkin/zipkin
    ports:
      - 9411:9411
  service-discovery-container:
    image: ${DOCKERHUB_USERNAME}/service-discovery-ecommerce-boot:dev
    ports:
      - 8761:8761
    environment:
      - SPRING_PROFILES_ACTIVE=dev
  cloud-config-container:
    image: ${DOCKERHUB_USERNAME}/cloud-config-ecommerce-boot:dev
    ports:
      - 9296:9296
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
    depends_on:
      - service-discovery-container
  api-gateway-container:
    image: ${DOCKERHUB_USERNAME}/api-gateway-ecommerce-boot:dev
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
    depends_on:
      - service-discovery-container
      - zipkin-container
  order-service-container:
    image: ${DOCKERHUB_USERNAME}/order-service-ecommerce-boot:dev
    ports:
      - 8300:8300
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
    depends_on:
      - service-discovery-container
      - zipkin-container
  product-service-container:
    image: ${DOCKERHUB_USERNAME}/product-service-ecommerce-boot:dev
    ports:
      - 8500:8500
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
    depends_on:
      - service-discovery-container
      - zipkin-container
  user-service-container:
    image: ${DOCKERHUB_USERNAME}/user-service-ecommerce-boot:dev
    ports:
      - 8700:8700
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery-container:8761/eureka/
      - SPRING_ZIPKIN_BASE_URL=http://zipkin-container:9411
    depends_on:
      - service-discovery-container
      - zipkin-container
