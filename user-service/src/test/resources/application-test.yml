server:
  port: 0
spring:
  application:
    name: USER-SERVICE
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
  zipkin:
    enabled: false
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: "*"